<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Arc Extract - Extraction Shooter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: #0a0e17;
      color: #e0e6ed;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    #ui-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(10,14,23,0.95), transparent);
      z-index: 10;
      pointer-events: none;
    }
    .stat {
      background: rgba(20,30,50,0.85);
      border: 1px solid #2a3a55;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    .stat span { color: #5eead4; }
    #game-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0f172a;
    }
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(5,8,15,0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #overlay.hidden { display: none; }
    h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #5eead4, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #94a3b8; margin-bottom: 28px; font-size: 1.05rem; }
    .btn {
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(14,165,233,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .controls {
      margin-top: 30px;
      font-size: 0.9rem;
      color: #64748b;
      line-height: 1.6;
    }
    #message {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.9);
      border: 1px solid #334155;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 15;
      pointer-events: none;
    }
    #message.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="ui-top">
    <div class="stat">HP <span id="hp">100</span></div>
    <div class="stat">Loot <span id="loot">0</span></div>
    <div class="stat">Time <span id="timer">4:00</span></div>
  </div>

  <div id="game-container">
    <canvas id="game"></canvas>
    <div id="message"></div>
  </div>

  <div id="overlay">
    <h1>ARC EXTRACT</h1>
    <p class="subtitle">Loot the zone. Fight the machines. Extract alive.</p>
    <button class="btn" id="start-btn">DROP IN</button>
    <div class="controls">
      WASD / Arrows — Move<br>
      Mouse — Aim & Shoot<br>
      Reach the glowing Extraction Zone to escape
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');
    const hpEl = document.getElementById('hp');
    const lootEl = document.getElementById('loot');
    const timerEl = document.getElementById('timer');
    const messageEl = document.getElementById('message');

    let width, height;
    function resize() {
      width = canvas.width = canvas.parentElement.clientWidth;
      height = canvas.height = canvas.parentElement.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Game state
    let gameState = 'menu'; // menu, playing, extracted, dead
    let player, enemies, bullets, crates, particles, extraction;
    let keys = {};
    let mouse = { x: 0, y: 0, down: false };
    let loot = 0;
    let timeLeft = 240; // 4 minutes
    let lastTime = 0;
    let spawnTimer = 0;

    const WORLD = { w: 2400, h: 1800 }; // larger than screen

    function showMessage(text, duration = 2500) {
      messageEl.textContent = text;
      messageEl.classList.add('show');
      setTimeout(() => messageEl.classList.remove('show'), duration);
    }

    function initGame() {
      player = {
        x: WORLD.w / 2,
        y: WORLD.h / 2,
        r: 16,
        hp: 100,
        maxHp: 100,
        speed: 3.2,
        angle: 0,
        shootCooldown: 0
      };

      enemies = [];
      bullets = [];
      crates = [];
      particles = [];
      loot = 0;
      timeLeft = 240;
      spawnTimer = 0;

      // Spawn crates
      for (let i = 0; i < 18; i++) {
        crates.push({
          x: 150 + Math.random() * (WORLD.w - 300),
          y: 150 + Math.random() * (WORLD.h - 300),
          r: 22,
          looted: false,
          value: 30 + Math.floor(Math.random() * 70)
        });
      }

      // Initial enemies
      for (let i = 0; i < 8; i++) spawnEnemy();

      // Extraction zone (appears after some time or fixed)
      extraction = {
        x: 200 + Math.random() * (WORLD.w - 400),
        y: 200 + Math.random() * (WORLD.h - 400),
        r: 70,
        active: true
      };

      gameState = 'playing';
      overlay.classList.add('hidden');
      updateUI();
      showMessage('Find loot and reach the Extraction Zone', 3000);
    }

    function spawnEnemy() {
      let x, y;
      do {
        x = Math.random() * WORLD.w;
        y = Math.random() * WORLD.h;
      } while (Math.hypot(x - player.x, y - player.y) < 350);

      enemies.push({
        x, y,
        r: 18,
        hp: 40 + Math.random() * 30,
        speed: 1.4 + Math.random() * 0.8,
        angle: 0,
        shootCooldown: 0,
        type: Math.random() > 0.7 ? 'heavy' : 'normal'
      });
    }

    function updateUI() {
      hpEl.textContent = Math.max(0, Math.floor(player.hp));
      lootEl.textContent = loot;
      const m = Math.floor(timeLeft / 60);
      const s = Math.floor(timeLeft % 60);
      timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
    }

    // Input
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });
    canvas.addEventListener('mousedown', () => mouse.down = true);
    canvas.addEventListener('mouseup', () => mouse.down = false);
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      mouse.down = true;
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.touches[0].clientX - rect.left;
      mouse.y = e.touches[0].clientY - rect.top;
    }, { passive: false });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.touches[0].clientX - rect.left;
      mouse.y = e.touches[0].clientY - rect.top;
    }, { passive: false });
    canvas.addEventListener('touchend', () => mouse.down = false);

    startBtn.addEventListener('click', initGame);

    function createParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1,
          color
        });
      }
    }

    function update(dt) {
      if (gameState !== 'playing') return;

      timeLeft -= dt;
      if (timeLeft <= 0) {
        gameState = 'dead';
        showEndScreen(false, 'Time ran out. Zone collapsed.');
        return;
      }

      // Player movement
      let dx = 0, dy = 0;
      if (keys['KeyW'] || keys['ArrowUp']) dy -= 1;
      if (keys['KeyS'] || keys['ArrowDown']) dy += 1;
      if (keys['KeyA'] || keys['ArrowLeft']) dx -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) dx += 1;

      if (dx || dy) {
        const len = Math.hypot(dx, dy);
        player.x += (dx / len) * player.speed;
        player.y += (dy / len) * player.speed;
      }

      // Clamp player
      player.x = Math.max(player.r, Math.min(WORLD.w - player.r, player.x));
      player.y = Math.max(player.r, Math.min(WORLD.h - player.r, player.y));

      // Aim
      const camX = player.x - width / 2;
      const camY = player.y - height / 2;
      const worldMouseX = mouse.x + camX;
      const worldMouseY = mouse.y + camY;
      player.angle = Math.atan2(worldMouseY - player.y, worldMouseX - player.x);

      // Shooting
      player.shootCooldown -= dt;
      if (mouse.down && player.shootCooldown <= 0) {
        bullets.push({
          x: player.x + Math.cos(player.angle) * 20,
          y: player.y + Math.sin(player.angle) * 20,
          vx: Math.cos(player.angle) * 11,
          vy: Math.sin(player.angle) * 11,
          life: 1.2,
          fromPlayer: true
        });
        player.shootCooldown = 0.18;
      }

      // Update bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life -= dt;
        if (b.life <= 0) {
          bullets.splice(i, 1);
          continue;
        }

        // Hit player
        if (!b.fromPlayer && Math.hypot(b.x - player.x, b.y - player.y) < player.r + 4) {
          player.hp -= 12;
          createParticles(player.x, player.y, '#f87171', 6);
          bullets.splice(i, 1);
          if (player.hp <= 0) {
            gameState = 'dead';
            showEndScreen(false, 'You were eliminated.');
            return;
          }
          continue;
        }

        // Hit enemies
        if (b.fromPlayer) {
          for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.hypot(b.x - e.x, b.y - e.y) < e.r + 4) {
              e.hp -= 18;
              createParticles(e.x, e.y, '#5eead4', 5);
              bullets.splice(i, 1);
              if (e.hp <= 0) {
                createParticles(e.x, e.y, '#fbbf24', 12);
                enemies.splice(j, 1);
                loot += 15;
              }
              break;
            }
          }
        }
      }

      // Enemies AI
      for (const e of enemies) {
        const dist = Math.hypot(player.x - e.x, player.y - e.y);
        e.angle = Math.atan2(player.y - e.y, player.x - e.x);

        if (dist > 80) {
          e.x += Math.cos(e.angle) * e.speed;
          e.y += Math.sin(e.angle) * e.speed;
        }

        e.shootCooldown -= dt;
        if (dist < 420 && e.shootCooldown <= 0) {
          bullets.push({
            x: e.x + Math.cos(e.angle) * 18,
            y: e.y + Math.sin(e.angle) * 18,
            vx: Math.cos(e.angle) * 7.5,
            vy: Math.sin(e.angle) * 7.5,
            life: 1.5,
            fromPlayer: false
          });
          e.shootCooldown = e.type === 'heavy' ? 0.9 : 1.3;
        }
      }

      // Spawn more enemies over time
      spawnTimer += dt;
      if (spawnTimer > 8 && enemies.length < 14) {
        spawnEnemy();
        spawnTimer = 0;
      }

      // Loot crates
      for (const c of crates) {
        if (!c.looted && Math.hypot(player.x - c.x, player.y - c.y) < player.r + c.r) {
          c.looted = true;
          loot += c.value;
          createParticles(c.x, c.y, '#fbbf24', 10);
          showMessage(`+${c.value} loot`, 1200);
        }
      }

      // Extraction check
      if (extraction.active && Math.hypot(player.x - extraction.x, player.y - extraction.y) < extraction.r - 10) {
        gameState = 'extracted';
        showEndScreen(true, `Extracted successfully with ${loot} loot!`);
        return;
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= dt * 2.5;
        if (p.life <= 0) particles.splice(i, 1);
      }

      updateUI();
    }

    function showEndScreen(success, msg) {
      overlay.classList.remove('hidden');
      overlay.innerHTML = `
        <h1 style="color:${success ? '#5eead4' : '#f87171'}">${success ? 'EXTRACTED' : 'KIA'}</h1>
        <p class="subtitle">${msg}</p>
        <p style="font-size:1.3rem;margin-bottom:24px">Final Loot: <strong style="color:#fbbf24">${loot}</strong></p>
        <button class="btn" id="restart-btn">DROP AGAIN</button>
      `;
      document.getElementById('restart-btn').addEventListener('click', initGame);
    }

    function draw() {
      // Camera follow player
      const camX = player.x - width / 2;
      const camY = player.y - height / 2;

      ctx.save();
      ctx.translate(-camX, -camY);

      // Background grid
      ctx.strokeStyle = 'rgba(30, 50, 80, 0.4)';
      ctx.lineWidth = 1;
      const grid = 80;
      for (let x = 0; x < WORLD.w; x += grid) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, WORLD.h);
        ctx.stroke();
      }
      for (let y = 0; y < WORLD.h; y += grid) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WORLD.w, y);
        ctx.stroke();
      }

      // Extraction zone
      if (extraction) {
        ctx.beginPath();
        ctx.arc(extraction.x, extraction.y, extraction.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.setLineDash([10, 8]);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('EXTRACT', extraction.x, extraction.y - extraction.r - 10);
      }

      // Crates
      for (const c of crates) {
        if (c.looted) continue;
        ctx.fillStyle = '#334155';
        ctx.fillRect(c.x - 18, c.y - 18, 36, 36);
        ctx.strokeStyle = '#fbbf24';
        ctx.lineWidth = 2;
        ctx.strokeRect(c.x - 18, c.y - 18, 36, 36);
        ctx.fillStyle = '#fbbf24';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('■', c.x, c.y + 6);
      }

      // Bullets
      for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = b.fromPlayer ? '#5eead4' : '#f87171';
        ctx.fill();
      }

      // Enemies
      for (const e of enemies) {
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.angle);

        // Body
        ctx.fillStyle = e.type === 'heavy' ? '#7c3aed' : '#ef4444';
        ctx.beginPath();
        ctx.moveTo(20, 0);
        ctx.lineTo(-14, 14);
        ctx.lineTo(-8, 0);
        ctx.lineTo(-14, -14);
        ctx.closePath();
        ctx.fill();

        // Eye
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(6, 0, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Player
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle);

      // Body
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.moveTo(18, 0);
      ctx.lineTo(-12, 12);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-12, -12);
      ctx.closePath();
      ctx.fill();

      // Cockpit
      ctx.fillStyle = '#e0f2fe';
      ctx.beginPath();
      ctx.arc(4, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Particles
      for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      ctx.restore();

      // Minimap
      const mmSize = 140;
      const mmX = width - mmSize - 16;
      const mmY = height - mmSize - 16;
      ctx.fillStyle = 'rgba(15,23,42,0.85)';
      ctx.fillRect(mmX, mmY, mmSize, mmSize);
      ctx.strokeStyle = '#334155';
      ctx.strokeRect(mmX, mmY, mmSize, mmSize);

      const scaleX = mmSize / WORLD.w;
      const scaleY = mmSize / WORLD.h;

      // Extraction on minimap
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(mmX + extraction.x * scaleX, mmY + extraction.y * scaleY, 5, 0, Math.PI * 2);
      ctx.fill();

      // Crates
      ctx.fillStyle = '#fbbf24';
      for (const c of crates) {
        if (!c.looted) {
          ctx.fillRect(mmX + c.x * scaleX - 2, mmY + c.y * scaleY - 2, 4, 4);
        }
      }

      // Enemies
      ctx.fillStyle = '#ef4444';
      for (const e of enemies) {
        ctx.beginPath();
        ctx.arc(mmX + e.x * scaleX, mmY + e.y * scaleY, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Player
      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.arc(mmX + player.x * scaleX, mmY + player.y * scaleY, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
